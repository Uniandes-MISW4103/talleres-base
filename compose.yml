# Application under test for the workshops: EverShop 2.1.1 with PostgreSQL 16.
# - http://localhost:3000: EverShop.
# - http://localhost:3001: the "release" version, the same store behind a proxy that adds
#   evershop/release/release.css and release.js to every page. RELEASE_DIR selects another folder
#   with those two files.
name: talleres

services:
  evershop:
    image: evershop/evershop:2.1.1
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  release:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      evershop:
        condition: service_healthy
    ports:
      - "3001:80"
    volumes:
      - ./evershop/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RELEASE_DIR:-./evershop/release}:/usr/share/nginx/release:ro

volumes:
  database:
