# Serves EverShop adding /__release/release.css and /__release/release.js before </head>.
server {
  listen 80;

  location /__release/ {
    alias /usr/share/nginx/release/;
    add_header Cache-Control "no-store";
  }

  location / {
    proxy_pass http://evershop:3000;
    proxy_set_header Host $http_host;
    # sub_filter can only rewrite uncompressed responses.
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/html application/json;
    sub_filter '</head>' '<link rel="stylesheet" href="/__release/release.css"><script defer src="/__release/release.js"></script></head>';
    # EverShop writes absolute URLs with its own origin; point them to this proxy so that API calls
    # (adding to the cart, signing in) stay on the release origin instead of failing with CORS.
    sub_filter 'http://localhost:3000' '$scheme://$http_host';
  }
}
